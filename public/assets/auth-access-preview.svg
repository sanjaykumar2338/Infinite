<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
  <title id="title">Infinite Sugar access dashboard preview</title>
  <desc id="desc">A themed product preview showing login access, coaching prompts, and report metrics.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8fb"/>
      <stop offset="0.48" stop-color="#f4f1ff"/>
      <stop offset="1" stop-color="#eefcf9"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f66f9b"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#594a89" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="760" height="560" rx="34" fill="url(#panel)"/>
  <circle cx="680" cy="72" r="92" fill="#22c7a9" opacity=".12"/>
  <circle cx="92" cy="468" r="118" fill="#f66f9b" opacity=".12"/>
  <g filter="url(#shadow)">
    <rect x="86" y="70" width="588" height="420" rx="28" fill="#fff" opacity=".94"/>
    <rect x="86" y="70" width="588" height="68" rx="28" fill="#171d2a"/>
    <circle cx="130" cy="104" r="9" fill="#f66f9b"/>
    <circle cx="160" cy="104" r="9" fill="#f4b740"/>
    <circle cx="190" cy="104" r="9" fill="#22c7a9"/>
    <rect x="494" y="94" width="116" height="20" rx="10" fill="#303746"/>
  </g>
  <g>
    <rect x="124" y="172" width="190" height="270" rx="24" fill="#f8f6ff"/>
    <rect x="154" y="202" width="60" height="60" rx="20" fill="url(#brand)"/>
    <text x="184" y="240" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#fff">IS</text>
    <text x="154" y="302" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#17202a">Secure access</text>
    <text x="154" y="335" font-family="Inter, Arial, sans-serif" font-size="17" fill="#6a7280">Firebase identity</text>
    <text x="154" y="363" font-family="Inter, Arial, sans-serif" font-size="17" fill="#6a7280">Laravel session</text>
    <rect x="154" y="398" width="112" height="18" rx="9" fill="#22c7a9" opacity=".22"/>
    <rect x="154" y="398" width="74" height="18" rx="9" fill="#22c7a9"/>
  </g>
  <g>
    <rect x="348" y="172" width="266" height="82" rx="18" fill="#fff7dc" stroke="#f4b740" stroke-opacity=".45"/>
    <text x="374" y="206" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#8a640c">Live prompt</text>
    <text x="374" y="232" font-family="Inter, Arial, sans-serif" font-size="16" fill="#5d6673">Ask one clarifying question next.</text>
    <rect x="348" y="280" width="126" height="92" rx="18" fill="#f3fbf8"/>
    <text x="374" y="315" font-family="Inter, Arial, sans-serif" font-size="15" fill="#6a7280">Talk balance</text>
    <text x="374" y="348" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="800" fill="#17202a">58%</text>
    <rect x="488" y="280" width="126" height="92" rx="18" fill="#f7f4ff"/>
    <text x="514" y="315" font-family="Inter, Arial, sans-serif" font-size="15" fill="#6a7280">Engagement</text>
    <text x="514" y="348" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="800" fill="#17202a">High</text>
    <rect x="348" y="398" width="266" height="44" rx="22" fill="#181d27"/>
    <text x="481" y="427" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#fff">Open dashboard</text>
  </g>
